[defaults]
# Inventory and connection defaults.
inventory = inventory.ini
interpreter_python = auto_silent
deprecation_warnings = True
host_key_checking = False
retry_files_enabled = False

# Search paths for external and custom roles and collections.
roles_path = ./roles/galaxy:./roles:~/.ansible/roles
collections_path = ./collections:~/.ansible/collections

# Output formatting: use clean multi-line YAML instead of JSON strings.
stdout_callback = default
callback_result_format = yaml
bin_ansible_callbacks = True
display_skipped_hosts = False

[ssh_connection]
# Optimize SSH connection latency and throughput.
pipelining = True
transfer_method = piped
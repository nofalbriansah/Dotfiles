---
# roles/workstation/tasks/packages.yml
# Manages system, user, and AUR packages across supported distributions.

# Arch Linux and derivative distributions (CachyOS, EndeavourOS, Manjaro).
- name: "ARCH | Manage Arch Linux packages and AUR"
  block:
    - name: "ARCH | Display user identifier"
      ansible.builtin.debug:
        msg: "User ID: {{ ansible_facts['user_id'] }}"

    - name: "ARCH | Remove legacy sudoers drop-in file"
      become: true
      ansible.builtin.file:
        path: "/etc/sudoers.d/10-ansible-yay"
        state: absent

    # Allow non-interactive package operations for pacman, yay, and systemctl.
    - name: "ARCH | Configure passwordless permissions for package tools"
      become: true
      ansible.builtin.copy:
        content: |
          {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/pacman
          {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/yay
          {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /usr/bin/systemctl
          {{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: /bin/systemctl
        dest: "/etc/sudoers.d/99-ansible-yay"
        mode: "0440"
        validate: "/usr/bin/visudo -cf %s"

    - name: "ARCH | Verify passwordless pacman execution"
      ansible.builtin.command: sudo -n /usr/bin/pacman --version
      changed_when: false
      ignore_errors: false

    - name: "ARCH | Update package database and upgrade system"
      become: true
      ansible.builtin.pacman:
        update_cache: true
        upgrade: true
      ignore_errors: true

    - name: "ARCH | Install official repository packages (batch)"
      become: true
      ansible.builtin.pacman:
        name: "{{ sys_packages }}"
        state: present

    - name: "ARCH | Install AUR packages via kewlfft.aur collection"
      kewlfft.aur.aur:
        name: "{{ item }}"
        use: yay
        state: present
      loop: "{{ aur_packages | default([]) }}"
      become: false

    - name: "SERVICE | Manage system services"
      become: true
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: "{{ item.state | default('started') }}"
      loop: "{{ enabled_services | default([]) }}"
      when: enabled_services is defined

  when: ansible_facts['os_family'] == "Archlinux"

# Debian and Ubuntu family distributions.
- name: "DEBIAN | Manage Debian and Ubuntu packages"
  block:
    - name: "DEBIAN | Update package cache and upgrade system"
      become: true
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
      ignore_errors: true

    - name: "DEBIAN | Install system packages (batch)"
      become: true
      ansible.builtin.apt:
        name: "{{ sys_packages }}"
        state: present

    - name: "SERVICE | Manage system services"
      become: true
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: "{{ item.state | default('started') }}"
      loop: "{{ enabled_services }}"
      when: enabled_services is defined

  when: ansible_facts['os_family'] == "Debian"

# Red Hat family distributions (Fedora, RHEL, CentOS).
- name: "FEDORA | Manage Red Hat family packages"
  block:
    - name: "FEDORA | Update package cache and upgrade system"
      become: true
      ansible.builtin.dnf:
        update_cache: true
        update_only: yes
      ignore_errors: true

    - name: "FEDORA | Install system packages (batch)"
      become: true
      ansible.builtin.dnf:
        name: "{{ sys_packages }}"
        state: present

    - name: "SERVICE | Manage system services"
      become: true
      ansible.builtin.systemd:
        name: "{{ item.name }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: "{{ item.state | default('started') }}"
      loop: "{{ enabled_services }}"
      when: enabled_services is defined

  when: ansible_facts['os_family'] == "RedHat"

# Android Termux environment.
- name: "ANDROID | Manage Android Termux packages"
  block:
    - name: "ANDROID | Update package cache"
      ansible.builtin.command: pkg update -y
      changed_when: false
      ignore_errors: true

    - name: "ANDROID | Install packages (batch)"
      ansible.builtin.command: "pkg install -y {{ sys_packages | join(' ') }}"
      register: pkg_install_out
      changed_when: "'0 upgraded, 0 newly installed' not in pkg_install_out.stdout"

  when: ansible_facts['os_family'] == "Android" or ansible_facts['distribution'] == "Android"

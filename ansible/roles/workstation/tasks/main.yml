---
# roles/workstation/tasks/main.yml

# Load OS-specific variables.
# Looks for distribution.yml (e.g., Fedora.yml), then os_family.yml (e.g., Archlinux.yml, Debian.yml),
# and falls back to default.yml.
- name: "SETUP | Load OS variables"
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['distribution'] }}.yml"
        - "{{ ansible_facts['os_family'] }}.yml"
        - "default.yml"
      paths:
        - "{{ role_path }}/vars"
      skip: true
  tags: ["always"]

# Execute system and user package management tasks.
- name: "TASK | Manage system packages"
  ansible.builtin.include_tasks: packages.yml
  tags: ["packages"]

# Symlink dotfiles and configuration directories into XDG paths.
- name: "TASK | Symlink configuration files"
  ansible.builtin.include_tasks: dotfiles.yml
  tags: ["dotfiles"]

# Deploy visual themes, icons, and wallpapers on Linux desktops.
- name: "TASK | Configure themes and assets"
  ansible.builtin.include_tasks: themes.yml
  tags: ["themes"]
  when: os_category == 'linux'

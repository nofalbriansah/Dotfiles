---
# roles/workstation/tasks/dotfiles.yml
# Symlinks user configuration directories and dotfiles into target locations.

# Ensure standard XDG base directories exist before linking files.
- name: "DOTFILES | Ensure standard XDG directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_config_dir }}"
    - "{{ xdg_data_dir }}"

# Discover configuration directories from common and platform-specific sources.
- name: "DOTFILES | Discover configuration directories"
  ansible.builtin.find:
    paths:
      - "{{ playbook_dir }}/files/common/configs"
      - "{{ playbook_dir }}/files/{{ os_category }}/configs"
    file_type: directory
  register: repo_configs

# Inspect target paths in ~/.config/ to identify directory conflicts.
- name: "DOTFILES | Inspect target configuration paths"
  ansible.builtin.stat:
    path: "{{ xdg_config_dir }}/{{ item.path | basename }}"
  register: target_dir_stats
  loop: "{{ repo_configs.files }}"

# Remove physical directories to allow clean symlink creation.
- name: "DOTFILES | Remove physical directory to resolve symlink conflict"
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  when:
    - item.stat.exists
    - item.stat.isdir
    - not item.stat.islnk
  loop: "{{ target_dir_stats.results }}"

# Symlink discovered configuration directories to ~/.config/.
- name: "DOTFILES | Symlink configuration directories to ~/.config"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ xdg_config_dir }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_configs.files }}"

# Discover home-level dotfiles (files intended for $HOME root).
- name: "DOTFILES | Discover home dotfiles in repository"
  ansible.builtin.find:
    paths:
      - "{{ playbook_dir }}/files/{{ os_category }}/home"
    hidden: true
    file_type: any
  register: found_home_files

# Inspect target paths in $HOME.
- name: "DOTFILES | Inspect target home paths"
  ansible.builtin.stat:
    path: "{{ user_home }}/{{ item.path | basename }}"
  register: target_home_stats
  loop: "{{ found_home_files.files }}"

# Remove physical directories in $HOME to allow symlink creation.
- name: "DOTFILES | Remove physical home directory to resolve symlink conflict"
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  when:
    - item.stat.exists
    - item.stat.isdir
    - not item.stat.islnk
  loop: "{{ target_home_stats.results }}"

# Symlink discovered home dotfiles to $HOME root.
- name: "DOTFILES | Symlink dotfiles to $HOME root"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ user_home }}/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ found_home_files.files }}"
  register: symlink_home_status

# Reload Termux user settings when configuration changes on Android.
- name: "DOTFILES | Reload Termux user configuration"
  ansible.builtin.command: termux-reload-settings
  changed_when: true
  ignore_errors: true
  when:
    - ansible_facts['distribution'] == 'Android' or ansible_facts['os_family'] == 'Android'
    - symlink_home_status is changed

---
# roles/workstation/tasks/themes.yml
# Deploys wallpapers, desktop icons, cursors, and GTK themes.

# Ensure standard XDG data directories exist.
- name: "THEME | Ensure local data directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_data_dir }}/icons"
    - "{{ xdg_data_dir }}/themes"
    - "{{ xdg_data_dir }}/backgrounds"

# Extract compressed theme assets archive into user data directory.
# Skips automatically if the target icon directory already exists.
- name: "THEME | Extract theme assets archive"
  ansible.builtin.unarchive:
    src: "{{ playbook_dir }}/files/themes/theme-assets.tar.xz"
    dest: "{{ xdg_data_dir }}"
    creates: "{{ xdg_data_dir }}/icons/icon-colloid-dark"

# Discover wallpaper image files in the repository.
- name: "THEME | Discover wallpaper images in repository"
  ansible.builtin.find:
    paths: "{{ playbook_dir }}/files/themes/backgrounds"
    file_type: file
  register: repo_backgrounds

# Symlink discovered wallpapers into user backgrounds directory.
- name: "THEME | Symlink wallpapers to backgrounds directory"
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ xdg_data_dir }}/backgrounds/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ repo_backgrounds.files }}"

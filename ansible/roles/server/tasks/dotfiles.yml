---
# roles/server/tasks/dotfiles.yml
# Deploys Neovim and Zellij configurations on server instances.

# Ensure standard XDG directories exist on the target host.
- name: "DOTFILES | Ensure XDG directories exist"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ xdg_config_dir }}"
    - "{{ xdg_data_dir }}"

# Verify target directory states in ~/.config/ to resolve conflicts.
- name: "DOTFILES | Inspect target configuration directories"
  ansible.builtin.stat:
    path: "{{ xdg_config_dir }}/{{ item }}"
  register: target_dir_stats
  loop:
    - nvim
    - zellij

# Remove physical directories if present to allow symlink creation.
- name: "DOTFILES | Remove physical directory if it exists"
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  when:
    - item.stat.exists
    - item.stat.isdir
    - not item.stat.islnk
  loop: "{{ target_dir_stats.results }}"

# Deploy configurations via symlink when executing locally on the server.
- name: "DOTFILES | Symlink configuration directories (local mode)"
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ xdg_config_dir }}/{{ item.dest }}"
    state: link
    force: true
  loop:
    - { src: "{{ playbook_dir }}/files/common/configs/nvim", dest: "nvim" }
    - { src: "{{ playbook_dir }}/files/linux/configs/zellij", dest: "zellij" }
  when: ansible_connection == 'local'

# Deploy configurations via file copy when provisioning remotely over SSH.
- name: "DOTFILES | Copy configuration directories (remote mode)"
  ansible.builtin.copy:
    src: "{{ item.src }}/"
    dest: "{{ xdg_config_dir }}/{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: "{{ playbook_dir }}/files/common/configs/nvim", dest: "nvim" }
    - { src: "{{ playbook_dir }}/files/linux/configs/zellij", dest: "zellij" }
  when: ansible_connection != 'local'

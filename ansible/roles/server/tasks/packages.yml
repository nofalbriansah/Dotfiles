---
# roles/server/tasks/packages.yml

# Synchronize system packages on Debian and Ubuntu servers.
- name: "DEBIAN | Sync system packages"
  block:
    - name: "DEBIAN | Update package cache"
      become: true
      ansible.builtin.apt:
        update_cache: true
      ignore_errors: true

    - name: "DEBIAN | Install packages (batch)"
      become: true
      ansible.builtin.apt:
        name: "{{ sys_packages }}"
        state: present
  when: ansible_facts['os_family'] == "Debian"

# Synchronize system packages on RedHat, CentOS, and Fedora servers.
- name: "REDHAT | Sync system packages"
  block:
    - name: "REDHAT | Update package cache"
      become: true
      ansible.builtin.dnf:
        update_cache: true
      ignore_errors: true

    - name: "REDHAT | Install packages (batch)"
      become: true
      ansible.builtin.dnf:
        name: "{{ sys_packages }}"
        state: present
  when: ansible_facts['os_family'] == "RedHat"

# Install Zellij terminal multiplexer directly from GitHub release archive.
# Automatically skips execution if the destination binary already exists.
- name: "ZELLIJ | Install Zellij binary from GitHub release"
  become: true
  ansible.builtin.unarchive:
    src: "https://github.com/zellij-org/zellij/releases/latest/download/zellij-{{ ansible_facts['architecture'] }}-unknown-linux-musl.tar.gz"
    dest: "/usr/local/bin"
    remote_src: true
    creates: "/usr/local/bin/zellij"
    mode: "0755"
